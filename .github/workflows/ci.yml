name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run build --workspace @rqg-example/express-app
      - run: npm run build --workspace @rqg-example/nestjs-app
      - run: npm pack --dry-run --workspace @rqg/core
      - run: npm pack --dry-run --workspace @rqg/express
      - run: npm pack --dry-run --workspace @rqg/nestjs
      - run: npm run distribution:prepare
      - name: Test isolated packed consumers
        if: matrix.node == 24
        run: npm run test:consumers:packed
