name: GitHub Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable source tag to release
        required: true
        default: v0.1.0
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.RELEASE_TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Validate release tag and version
        shell: bash
        run: |
          test "$RELEASE_TAG" != "${RELEASE_TAG#v}"
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
          version="${RELEASE_TAG#v}"
          test "$version" = "$(node -p "require('./package.json').version")"
      - name: Prepare package-root distributions
        run: npm run distribution:prepare -- --repository "$GITHUB_REPOSITORY"
      - name: Create immutable package tags
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          npm run distribution:tags -- --push
      - name: Load current verification fix for an immutable source tag
        if: github.event_name == 'workflow_dispatch'
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: |
          git cat-file -e "$WORKFLOW_SHA^{commit}" 2>/dev/null || git fetch origin "$WORKFLOW_SHA"
          git show "$WORKFLOW_SHA:scripts/test-consumers.mjs" > scripts/test-consumers.mjs
      - name: Verify GitHub installations
        run: npm run test:consumers:git
      - name: Pack release assets
        shell: bash
        run: |
          mkdir -p release-assets
          npm pack .release/packages/core --pack-destination release-assets
          npm pack .release/packages/express --pack-destination release-assets
          npm pack .release/packages/nestjs --pack-destination release-assets
          (cd release-assets && sha256sum *.tgz > SHA256SUMS)
      - name: Write release notes
        shell: bash
        run: |
          version="${RELEASE_TAG#v}"
          cat > release-notes.md <<EOF
          # rqg ${RELEASE_TAG}

          Educational HTTP request protection primitives and adapters for Express 5 and NestJS 11.

          ## Install from immutable Git tags

          \`npm install --allow-git=all git+https://github.com/${GITHUB_REPOSITORY}.git#core-v${version}\`

          \`npm install --allow-git=all git+https://github.com/${GITHUB_REPOSITORY}.git#express-v${version} express@^5\`

          \`npm install --allow-git=all git+https://github.com/${GITHUB_REPOSITORY}.git#nestjs-v${version} @nestjs/common@^11 @nestjs/core@^11 @nestjs/platform-express@^11 reflect-metadata@^0.2 rxjs@^7.8\`

          The attached tarballs contain the same package trees. This project is educational, feature-complete for its intended scope, and not actively maintained. Use in production at your own risk.
          EOF
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release-assets/* --clobber
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md --title "$RELEASE_TAG"
          else
            gh release create "$RELEASE_TAG" release-assets/* --verify-tag --title "$RELEASE_TAG" --notes-file release-notes.md
          fi
